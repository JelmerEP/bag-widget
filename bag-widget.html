<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 8px 0; }
    #zoek-wrapper { position: relative; }
    #bag-adres-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    #bag-adres-input:focus { border-color: #0099e5; }
    #suggesties {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestie-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .suggestie-item:hover { background: #f5f5f5; }
    #bag-status {
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }
    .status-ok    { background: #EAF3DE; color: #3B6D11; display: block !important; }
    .status-fout  { background: #FCEBEB; color: #A32D2D; display: block !important; }
    .status-bezig { background: #E6F1FB; color: #185FA5; display: block !important; }
    #bag-resultaat {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    #bag-resultaat table { width: 100%; border-collapse: collapse; }
    #bag-resultaat td { padding: 3px 6px; }
    #bag-resultaat td:first-child { color: #666; width: 120px; }
    #bag-resultaat td:last-child { font-weight: bold; }
  </style>
</head>
<body>
  <div id="zoek-wrapper">
    <input
      type="text"
      id="bag-adres-input"
      placeholder="Typ een adres, bijv. Dorpsstraat 12 Amsterdam"
      autocomplete="off"
    />
    <div id="suggesties"></div>
  </div>
  <div id="bag-status"></div>
  <div id="bag-resultaat">
    <table>
      <tr><td>Bouwjaar:</td><td id="res-bouwjaar">—</td></tr>
      <tr><td>Gebouwhoogte:</td><td id="res-hoogte">—</td></tr>
    </table>
  </div>

  <script>
    var adresInput   = document.getElementById('bag-adres-input');
    var suggestieEl  = document.getElementById('suggesties');
    var statusEl     = document.getElementById('bag-status');
    var resultaatEl  = document.getElementById('bag-resultaat');
    var resBouwjaar  = document.getElementById('res-bouwjaar');
    var resHoogte    = document.getElementById('res-hoogte');
    var zoekTimer    = null;
    var gevondenData = { bouwjaar: '', hoogte: '' };

    JFCustomWidget.subscribe('ready', function() {
      var bestaand = JFCustomWidget.getWidgetSetting('defaultValue');
      if (bestaand) adresInput.value = bestaand;
    });

    // Bij verzenden: stuur bouwjaar|hoogte als widget-waarde
    // Jotform conditional logic kan dit uitlezen
    JFCustomWidget.subscribe('submit', function() {
      var waarde = gevondenData.bouwjaar + '|' + gevondenData.hoogte;
      JFCustomWidget.sendSubmit({ valid: true, value: waarde });
    });

    function toonStatus(tekst, type) {
      statusEl.textContent = tekst;
      statusEl.className   = 'status-' + type;
    }

    // Suggesties ophalen via PDOK
    adresInput.addEventListener('input', function() {
      clearTimeout(zoekTimer);
      var q = adresInput.value.trim();
      suggestieEl.style.display = 'none';
      suggestieEl.innerHTML = '';
      statusEl.className = '';
      resultaatEl.style.display = 'none';
      if (q.length < 5) return;

      zoekTimer = setTimeout(function() {
        fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest?q='
          + encodeURIComponent(q) + '&fq=type:adres&rows=5')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var docs = data && data.response && data.response.docs;
            if (!docs || !docs.length) return;
            docs.forEach(function(doc) {
              var item = document.createElement('div');
              item.className   = 'suggestie-item';
              item.textContent = doc.weergavenaam;
              item.addEventListener('click', function() {
                adresInput.value          = doc.weergavenaam;
                suggestieEl.style.display = 'none';
                haalPdokLookup(doc.id);
              });
              suggestieEl.appendChild(item);
            });
            suggestieEl.style.display = 'block';
          }).catch(function() {});
      }, 400);
    });

    document.addEventListener('click', function(e) {
      if (!document.getElementById('zoek-wrapper').contains(e.target)) {
        suggestieEl.style.display = 'none';
      }
    });

    function haalPdokLookup(pdokId) {
      toonStatus('Adres opzoeken…', 'bezig');
      fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id='
        + encodeURIComponent(pdokId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var doc = data && data.response && data.response.docs && data.response.docs[0];
          if (!doc) { toonStatus('Adres niet gevonden', 'fout'); return; }
          haalPandId(doc.adresseerbaarobject_id);
        })
        .catch(function() { toonStatus('Fout bij opzoeken', 'fout'); });
    }

    function haalPandId(verblijfsobjectId) {
      toonStatus('Pand opzoeken…', 'bezig');
      var url = 'https://service.pdok.nl/lv/bag/wfs/v2_0'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=bag:verblijfsobject&count=1'
        + '&outputFormat=application/json'
        + "&CQL_FILTER=identificatie='" + verblijfsobjectId + "'";
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var features = data && data.features;
          if (!features || !features.length) { toonStatus('Pand niet gevonden', 'fout'); return; }
          var pandId = features[0].properties && (features[0].properties.pandidentificatie || features[0].properties.pand_identificatie);
          if (pandId) haalBouwjaar(pandId);
          else toonStatus('Pand niet gevonden', 'fout');
        })
        .catch(function() { toonStatus('Fout bij ophalen pand', 'fout'); });
    }

    function haalBouwjaar(pandId) {
      toonStatus('Bouwjaar ophalen…', 'bezig');
      var url = 'https://service.pdok.nl/lv/bag/wfs/v2_0'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=bag:pand&count=1'
        + '&outputFormat=application/json'
        + "&CQL_FILTER=identificatie='" + pandId + "'";
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var features = data && data.features;
          if (features && features.length) {
            var bouwjaar = features[0].properties && (features[0].properties.bouwjaar || features[0].properties.oorspronkelijkbouwjaar);
            if (bouwjaar) {
              gevondenData.bouwjaar = String(bouwjaar);
              resBouwjaar.textContent = bouwjaar;
              // Stuur waarde direct naar widget veld zodat conditional logic het kan uitlezen
              JFCustomWidget.sendSubmit({ valid: true, value: gevondenData.bouwjaar + '|' + gevondenData.hoogte });
            }
          }
          resultaatEl.style.display = 'block';
          toonStatus('Bouwjaar gevonden ✓', 'ok');
        })
        .catch(function() { toonStatus('Fout bij bouwjaar', 'fout'); });
    }
  </script>
</body>
</html>
