
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 8px 0; }
    #zoek-wrapper { position: relative; }
    #bag-adres-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    #bag-adres-input:focus { border-color: #0099e5; }
    #suggesties {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestie-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .suggestie-item:hover { background: #f5f5f5; }
    #bag-status {
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }
    .status-ok    { background: #EAF3DE; color: #3B6D11; display: block !important; }
    .status-fout  { background: #FCEBEB; color: #A32D2D; display: block !important; }
    .status-bezig { background: #E6F1FB; color: #185FA5; display: block !important; }
    #bag-resultaat {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    #bag-resultaat table { width: 100%; }
    #bag-resultaat td { padding: 3px 6px; }
    #bag-resultaat td:first-child { color: #666; width: 120px; }
    #bag-resultaat td:last-child { font-weight: bold; }
  </style>
</head>
<body>
  <div id="zoek-wrapper">
    <input type="text" id="bag-adres-input"
      placeholder="Typ een adres, bijv. Dorpsstraat 12 Amsterdam"
      autocomplete="off"/>
    <div id="suggesties"></div>
  </div>
  <div id="bag-status"></div>
  <div id="bag-resultaat">
    <table>
      <tr><td>Bouwjaar:</td>     <td id="res-bouwjaar">—</td></tr>
      <tr><td>Gebouwhoogte:</td> <td id="res-hoogte">—</td></tr>
    </table>
  </div>

  <script>
    var adresInput     = document.getElementById('bag-adres-input');
    var suggestieEl    = document.getElementById('suggesties');
    var statusEl       = document.getElementById('bag-status');
    var resultaatEl    = document.getElementById('bag-resultaat');
    var resBouwjaar = document.getElementById('res-bouwjaar');
    var resHoogte   = document.getElementById('res-hoogte');
    var zoekTimer      = null;
    var bagData        = {};

    JFCustomWidget.subscribe('ready', function () {
      var bestaand = JFCustomWidget.getWidgetSetting('defaultValue');
      if (bestaand) adresInput.value = bestaand;
    });

    // Bouwt de waarde die op de inzending/uitdraai komt te staan.
    function maakWaarde() {
      var bj = bagData.bouwjaar ? bagData.bouwjaar : 'onbekend';
      var ht = bagData.hoogte   ? bagData.hoogte + ' m' : 'onbekend';
      return 'Bouwjaar: ' + bj + '  |  Gebouwhoogte: ' + ht;
    }

    // Bij elke nieuwe waarde meteen doorgeven aan JotForm, zodat de
    // laatst gevonden gegevens altijd in de inzending terechtkomen.
    JFCustomWidget.subscribe('submit', function () {
      JFCustomWidget.sendSubmit({
        valid: true,
        value: bagData.bouwjaar || bagData.hoogte ? maakWaarde() : adresInput.value
      });
    });

    function toonStatus(tekst, type) {
      statusEl.textContent = tekst;
      statusEl.className   = 'status-' + type;
    }

    function reset() {
      suggestieEl.style.display = 'none';
      suggestieEl.innerHTML     = '';
      statusEl.className        = '';
      resultaatEl.style.display = 'none';
      resBouwjaar.textContent   = '—';
      resHoogte.textContent     = '—';
      bagData = {};
    }

    // ── Stap 1: PDOK autocomplete ────────────────────────────────────────────

    adresInput.addEventListener('input', function () {
      clearTimeout(zoekTimer);
      var q = adresInput.value.trim();
      reset();
      if (q.length < 5) return;

      zoekTimer = setTimeout(function () {
        fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest?q='
          + encodeURIComponent(q) + '&fq=type:adres&rows=5')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var docs = data && data.response && data.response.docs;
            if (!docs || !docs.length) return;
            docs.forEach(function (doc) {
              var item = document.createElement('div');
              item.className   = 'suggestie-item';
              item.textContent = doc.weergavenaam;
              item.addEventListener('click', function () {
                adresInput.value          = doc.weergavenaam;
                suggestieEl.style.display = 'none';
                haalLookup(doc.id);
              });
              suggestieEl.appendChild(item);
            });
            suggestieEl.style.display = 'block';
          })
          .catch(function () {});
      }, 400);
    });

    document.addEventListener('click', function (e) {
      if (!document.getElementById('zoek-wrapper').contains(e.target)) {
        suggestieEl.style.display = 'none';
      }
    });

    // ── Stap 2: PDOK lookup → RD-coördinaten (EPSG:28992) ───────────────────

    function haalLookup(pdokId) {
      toonStatus('Adres opzoeken…', 'bezig');
      fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id='
        + encodeURIComponent(pdokId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var doc = data && data.response && data.response.docs && data.response.docs[0];
          if (!doc) { toonStatus('Adres niet gevonden', 'fout'); return; }

          // RD-coördinaten (EPSG:28992) gebruiken — geen asorde-verwarring zoals bij lat/lon
          var match = doc.centroide_rd && doc.centroide_rd.match(/POINT\(([^ ]+) ([^ ]+)\)/);
          if (!match) { toonStatus('Coördinaten niet gevonden', 'fout'); return; }

          haalVerblijfsobject(parseFloat(match[1]), parseFloat(match[2]));
        })
        .catch(function () { toonStatus('Fout bij lookup', 'fout'); });
    }

    // ── Stap 3: PDOK BAG WFS → bouwjaar + pandId voor 3DBAG ────────────────

    function haalVerblijfsobject(x, y) {
      toonStatus('BAG gegevens ophalen…', 'bezig');

      var d    = 10; // 10 meter bounding box rondom het punt (RD-coördinaten)
      var bbox = (x - d).toFixed(3) + ',' + (y - d).toFixed(3) + ','
               + (x + d).toFixed(3) + ',' + (y + d).toFixed(3);

      fetch('https://service.pdok.nl/lv/bag/wfs/v2_0'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=bag:verblijfsobject&count=1'
        + '&outputFormat=application/json'
        + '&srsName=urn:ogc:def:crs:EPSG::28992'
        + '&BBOX=' + bbox + ',urn:ogc:def:crs:EPSG::28992')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var features = data && data.features;
          if (!features || !features.length) {
            toonStatus('Verblijfsobject niet gevonden', 'fout');
            return;
          }

          var props = features[0].properties;
          // Alle beschikbare veldnamen loggen zodat je ze kunt verifiëren
          console.log('BAG verblijfsobject properties:', JSON.stringify(props));

          bagData.bouwjaar = String(props.bouwjaar || '');
          // Veldnaam kan 'pandidentificatie' of 'pandref' zijn afhankelijk van WFS-versie
          bagData.pandId   = props.pandidentificatie || props.pandref || '';

          resBouwjaar.textContent   = bagData.bouwjaar || '—';
          resultaatEl.style.display = 'block';

          if (bagData.pandId) {
            haal3DBAG(bagData.pandId);
          } else {
            console.warn('Geen pandidentificatie gevonden. Beschikbare velden:', JSON.stringify(props));
            toonStatus('Gegevens gevonden (hoogte niet beschikbaar)', 'ok');
            JFCustomWidget.sendData({ value: maakWaarde() });
          }
        })
        .catch(function (e) {
          console.error('BAG WFS fout:', e);
          toonStatus('Fout bij BAG ophalen', 'fout');
        });
    }

    // ── Stap 4: 3DBAG WFS (TU Delft) → gebouwhoogte ─────────────────────────
    // De items-API (api.3dbag.nl) heeft geen CORS; de WFS (data.3dbag.nl) wél.

    function haal3DBAG(pandId) {
      toonStatus('Gebouwhoogte ophalen…', 'bezig');

      // 3DBAG verwacht het INSPIRE-formaat: NL.IMBAG.Pand.{id}
      var id3d = pandId.indexOf('NL.IMBAG') === -1
        ? 'NL.IMBAG.Pand.' + pandId
        : pandId;

      fetch('https://data.3dbag.nl/api/BAG3D/wfs'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=BAG3D:lod12&count=1'
        + '&outputFormat=application/json'
        + "&CQL_FILTER=identificatie='" + id3d + "'")
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          var f = data && data.features && data.features[0];
          var props = f && f.properties;
          console.log('3DBAG properties:', JSON.stringify(props));

          if (props && props.b3_h_50p != null) {
            var dak      = props.b3_h_50p;                  // dakhoogte (m t.o.v. NAP)
            var maaiveld = props.b3_h_maaiveld != null ? props.b3_h_maaiveld : 0;
            bagData.hoogte = (dak - maaiveld).toFixed(1);   // gebouwhoogte in meters
            resHoogte.textContent = bagData.hoogte + ' m';
            toonStatus('Alle gegevens gevonden ✓', 'ok');
          } else {
            console.warn('b3_h_50p niet gevonden in 3DBAG:', JSON.stringify(props));
            toonStatus('Gegevens gevonden (hoogte niet beschikbaar)', 'ok');
          }

          JFCustomWidget.sendData({ value: maakWaarde() });
        })
        .catch(function (e) {
          console.error('3DBAG fout:', e);
          // Stuur BAG-data toch door, ook als 3DBAG mislukt
          toonStatus('Gegevens gevonden (hoogte: fout bij ophalen)', 'ok');
          JFCustomWidget.sendData({ value: maakWaarde() });
        });
    }
  </script>
</body>
</html>
