
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 8px 0; }
    #zoek-wrapper { position: relative; }
    #bag-adres-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    #bag-adres-input:focus { border-color: #0099e5; }
    #suggesties {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestie-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .suggestie-item:hover { background: #f5f5f5; }
    #bag-status {
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }
    .status-ok    { background: #EAF3DE; color: #3B6D11; display: block !important; }
    .status-fout  { background: #FCEBEB; color: #A32D2D; display: block !important; }
    .status-bezig { background: #E6F1FB; color: #185FA5; display: block !important; }
    #bag-resultaat {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    #bag-resultaat table { width: 100%; border-collapse: collapse; }
    #bag-resultaat td { padding: 3px 6px; }
    #bag-resultaat td:first-child { color: #666; width: 120px; }
    #bag-resultaat td:last-child { font-weight: bold; }
  </style>
</head>
<body>
  <div id="zoek-wrapper">
    <input
      type="text"
      id="bag-adres-input"
      placeholder="Typ een adres, bijv. Dorpsstraat 12 Amsterdam"
      autocomplete="off"
    />
    <div id="suggesties"></div>
  </div>
  <div id="bag-status"></div>
  <div id="bag-resultaat">
    <table>
      <tr><td>Bouwjaar:</td><td id="res-bouwjaar">—</td></tr>
    </table>
  </div>

  <script>
    var adresInput  = document.getElementById('bag-adres-input');
    var suggestieEl = document.getElementById('suggesties');
    var statusEl    = document.getElementById('bag-status');
    var resultaatEl = document.getElementById('bag-resultaat');
    var resBouwjaar = document.getElementById('res-bouwjaar');
    var zoekTimer   = null;
    var gevondenBouwjaar = '';

    JFCustomWidget.subscribe('ready', function() {
      var bestaand = JFCustomWidget.getWidgetSetting('defaultValue');
      if (bestaand) adresInput.value = bestaand;
    });

    JFCustomWidget.subscribe('submit', function() {
      JFCustomWidget.sendSubmit({ valid: true, value: gevondenBouwjaar || adresInput.value });
    });

    function toonStatus(tekst, type) {
      statusEl.textContent = tekst;
      statusEl.className   = 'status-' + type;
    }

    // Suggesties ophalen via PDOK
    adresInput.addEventListener('input', function() {
      clearTimeout(zoekTimer);
      var q = adresInput.value.trim();
      suggestieEl.style.display = 'none';
      suggestieEl.innerHTML = '';
      statusEl.className = '';
      resultaatEl.style.display = 'none';
      resBouwjaar.textContent = '—';
      gevondenBouwjaar = '';
      if (q.length < 5) return;

      zoekTimer = setTimeout(function() {
        fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest?q='
          + encodeURIComponent(q) + '&fq=type:adres&rows=5')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var docs = data && data.response && data.response.docs;
            if (!docs || !docs.length) return;
            suggestieEl.innerHTML = '';
            docs.forEach(function(doc) {
              var item = document.createElement('div');
              item.className   = 'suggestie-item';
              item.textContent = doc.weergavenaam;
              item.addEventListener('click', function() {
                adresInput.value          = doc.weergavenaam;
                suggestieEl.style.display = 'none';
                haalPdokLookup(doc.id);
              });
              suggestieEl.appendChild(item);
            });
            suggestieEl.style.display = 'block';
          }).catch(function() {});
      }, 400);
    });

    document.addEventListener('click', function(e) {
      if (!document.getElementById('zoek-wrapper').contains(e.target)) {
        suggestieEl.style.display = 'none';
      }
    });

    // Stap 1: PDOK lookup → adresseerbaarobject_id
    function haalPdokLookup(pdokId) {
      toonStatus('Adres opzoeken…', 'bezig');
      console.log('Stap 1 - PDOK lookup id:', pdokId);

      fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id='
        + encodeURIComponent(pdokId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var doc = data && data.response && data.response.docs && data.response.docs[0];
          if (!doc) { toonStatus('Adres niet gevonden', 'fout'); return; }

          var verblijfsobjectId = doc.adresseerbaarobject_id;
          if (Array.isArray(verblijfsobjectId)) verblijfsobjectId = verblijfsobjectId[0];
          console.log('Stap 1 - verblijfsobjectId:', verblijfsobjectId);

          if (verblijfsobjectId) {
            haalVerblijfsobject(verblijfsobjectId);
          } else {
            toonStatus('Geen verblijfsobject gevonden', 'fout');
          }
        })
        .catch(function(e) {
          console.error('Stap 1 fout:', e);
          toonStatus('Fout bij opzoeken', 'fout');
        });
    }

    // Stap 2: verblijfsobject via PDOK OGC API Features (geen WFS!)
    function haalVerblijfsobject(verblijfsobjectId) {
      toonStatus('Pand opzoeken…', 'bezig');
      // OGC API Features gebruikt query parameter - geen CQL filter nodig
      var url = 'https://service.pdok.nl/lv/bag/ogc/v1_0/collections/verblijfsobjecten/items'
        + '?identificatie=' + encodeURIComponent(verblijfsobjectId)
        + '&f=json&limit=1&_=' + Date.now();

      console.log('Stap 2 - OGC verblijfsobject URL:', url);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('Stap 2 - OGC result:', JSON.stringify(data).substring(0, 500));
          var features = data && data.features;
          if (!features || !features.length) {
            toonStatus('Verblijfsobject niet gevonden', 'fout');
            return;
          }
          var props  = features[0].properties;
          var pandId = props && (props.pandidentificatie || props.pand_identificatie);
          if (Array.isArray(pandId)) pandId = pandId[0];
          console.log('Stap 2 - pandId:', pandId);
          console.log('Stap 2 - alle properties:', JSON.stringify(props));

          if (pandId) {
            haalPand(String(pandId));
          } else {
            toonStatus('Pand-ID niet gevonden', 'fout');
          }
        })
        .catch(function(e) {
          console.error('Stap 2 fout:', e);
          toonStatus('Fout bij verblijfsobject ophalen', 'fout');
        });
    }

    // Stap 3: pand via PDOK OGC API Features → bouwjaar
    function haalPand(pandId) {
      toonStatus('Bouwjaar ophalen…', 'bezig');
      var url = 'https://service.pdok.nl/lv/bag/ogc/v1_0/collections/panden/items'
        + '?identificatie=' + encodeURIComponent(pandId)
        + '&f=json&limit=1&_=' + Date.now();

      console.log('Stap 3 - OGC pand URL:', url);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('Stap 3 - OGC pand result:', JSON.stringify(data).substring(0, 500));
          var features = data && data.features;
          if (!features || !features.length) {
            toonStatus('Pand niet gevonden', 'fout');
            return;
          }
          var props    = features[0].properties;
          var bouwjaar = props && (props.bouwjaar || props.oorspronkelijkbouwjaar);
          console.log('Stap 3 - bouwjaar:', bouwjaar, 'voor pandId:', pandId);

          if (bouwjaar) {
            gevondenBouwjaar = String(bouwjaar);
            resBouwjaar.textContent = bouwjaar;
            resultaatEl.style.display = 'block';
            toonStatus('Bouwjaar gevonden ✓', 'ok');
            // Stuur waarde naar Jotform via sendSubmit
            JFCustomWidget.sendSubmit({ valid: true, value: gevondenBouwjaar });
          } else {
            toonStatus('Bouwjaar niet beschikbaar', 'fout');
          }
        })
        .catch(function(e) {
          console.error('Stap 3 fout:', e);
          toonStatus('Fout bij pand ophalen', 'fout');
        });
    }
  </script>
</body>
</html>
