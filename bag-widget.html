<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 8px 0; }
    #zoek-wrapper { position: relative; }
    #bag-adres-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    #bag-adres-input:focus { border-color: #0099e5; }
    #suggesties {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 9999;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestie-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .suggestie-item:hover { background: #f5f5f5; }
    #bag-status {
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }
    .status-ok    { background: #EAF3DE; color: #3B6D11; display: block !important; }
    .status-fout  { background: #FCEBEB; color: #A32D2D; display: block !important; }
    .status-bezig { background: #E6F1FB; color: #185FA5; display: block !important; }
  </style>
</head>
<body>
  <div id="zoek-wrapper">
    <input
      type="text"
      id="bag-adres-input"
      placeholder="Typ een adres, bijv. Dorpsstraat 12 Amsterdam"
      autocomplete="off"
    />
    <div id="suggesties"></div>
  </div>
  <div id="bag-status"></div>

  <script>
    // Veld-IDs: alleen het getal achter input_
    var VELD = {
      adres:    '131',
      postcode: '132',
      bouwjaar: '18',
      hoogte:   '29'
    };

    var adresInput  = document.getElementById('bag-adres-input');
    var suggestieEl = document.getElementById('suggesties');
    var statusEl    = document.getElementById('bag-status');
    var zoekTimer   = null;

    JFCustomWidget.subscribe('ready', function() {
      var bestaand = JFCustomWidget.getWidgetSetting('defaultValue');
      if (bestaand) adresInput.value = bestaand;
    });

    JFCustomWidget.subscribe('submit', function() {
      JFCustomWidget.sendSubmit({ valid: true, value: adresInput.value });
    });

    function toonStatus(tekst, type) {
      statusEl.textContent = tekst;
      statusEl.className   = 'status-' + type;
    }

    // Veld vullen via postMessage naar Jotform parent
    function vulVeld(id, waarde) {
      window.parent.postMessage('{"action":"setFieldValue","fieldID":"input_' + id + '","value":"' + waarde + '"}', '*');
    }

    // Suggesties ophalen via PDOK
    adresInput.addEventListener('input', function() {
      clearTimeout(zoekTimer);
      var q = adresInput.value.trim();
      suggestieEl.style.display = 'none';
      suggestieEl.innerHTML = '';
      statusEl.className = '';
      if (q.length < 5) return;

      zoekTimer = setTimeout(function() {
        fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest?q='
          + encodeURIComponent(q) + '&fq=type:adres&rows=5')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var docs = data && data.response && data.response.docs;
            if (!docs || !docs.length) return;
            docs.forEach(function(doc) {
              var item = document.createElement('div');
              item.className   = 'suggestie-item';
              item.textContent = doc.weergavenaam;
              item.addEventListener('click', function() {
                adresInput.value          = doc.weergavenaam;
                suggestieEl.style.display = 'none';
                haalBAGGegevens(doc.id, doc.weergavenaam);
              });
              suggestieEl.appendChild(item);
            });
            suggestieEl.style.display = 'block';
          }).catch(function() {});
      }, 400);
    });

    document.addEventListener('click', function(e) {
      if (!document.getElementById('zoek-wrapper').contains(e.target)) {
        suggestieEl.style.display = 'none';
      }
    });

    // Stap 1: PDOK lookup → postcode + adresseerbaarobject_id
    function haalBAGGegevens(pdokId, weergavenaam) {
      toonStatus('BAG gegevens ophalen…', 'bezig');
      fetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id=' + encodeURIComponent(pdokId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var doc = data && data.response && data.response.docs && data.response.docs[0];
          if (!doc) { toonStatus('Adres niet gevonden', 'fout'); return; }

          vulVeld(VELD.adres,    weergavenaam);
          vulVeld(VELD.postcode, doc.postcode || '');

          var verblijfsobjectId = doc.adresseerbaarobject_id;
          console.log('adresseerbaarobject_id:', verblijfsobjectId);

          if (verblijfsobjectId) {
            haalPandIdViaWFS(verblijfsobjectId);
          } else {
            toonStatus('Postcode ingevuld ✓', 'ok');
          }
        })
        .catch(function() { toonStatus('Fout bij BAG lookup', 'fout'); });
    }

    // Stap 2: verblijfsobject → pand_id via PDOK WFS (geen API key nodig)
    function haalPandIdViaWFS(verblijfsobjectId) {
      toonStatus('Pand opzoeken…', 'bezig');

      // PDOK BAG WFS: zoek pand op via verblijfsobject identificatie
      var url = 'https://service.pdok.nl/lv/bag/wfs/v2_0'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=bag:verblijfsobject'
        + '&count=1&outputFormat=application/json'
        + '&CQL_FILTER=identificatie=' + "'" + verblijfsobjectId + "'";

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('WFS verblijfsobject:', JSON.stringify(data).substring(0, 500));
          var features = data && data.features;
          if (!features || !features.length) {
            toonStatus('Postcode ingevuld ✓ (pand niet gevonden)', 'ok');
            return;
          }
          var props   = features[0].properties;
          var pandRef = props && (props.pandidentificatie || props.pand_identificatie);
          console.log('pandRef:', pandRef);

          if (pandRef) {
            haalPandGegevens(pandRef);
          } else {
            toonStatus('Postcode ingevuld ✓ (pand niet gevonden)', 'ok');
          }
        })
        .catch(function(err) {
          console.error('WFS fout:', err);
          toonStatus('Postcode ingevuld ✓', 'ok');
        });
    }

    // Stap 3: pand_id → bouwjaar via PDOK WFS
    function haalPandGegevens(pandId) {
      toonStatus('Bouwjaar ophalen…', 'bezig');
      console.log('Pand ID:', pandId);

      var url = 'https://service.pdok.nl/lv/bag/wfs/v2_0'
        + '?service=WFS&version=2.0.0&request=GetFeature'
        + '&typeNames=bag:pand'
        + '&count=1&outputFormat=application/json'
        + '&CQL_FILTER=identificatie=' + "'" + pandId + "'";

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('WFS pand:', JSON.stringify(data).substring(0, 500));
          var features = data && data.features;
          if (features && features.length) {
            var props    = features[0].properties;
            var bouwjaar = props && (props.bouwjaar || props.oorspronkelijkbouwjaar);
            console.log('Bouwjaar:', bouwjaar);
            if (bouwjaar) {
              vulVeld(VELD.bouwjaar, String(bouwjaar));
            }
          }
          toonStatus('Postcode en bouwjaar ingevuld ✓', 'ok');
          haalGebouwhoogte(pandId);
        })
        .catch(function(err) {
          console.error('Pand WFS fout:', err);
          toonStatus('Postcode ingevuld ✓', 'ok');
          haalGebouwhoogte(pandId);
        });
    }

    // Stap 4: gebouwhoogte via 3D BAG (TU Delft)
    function haalGebouwhoogte(pandId) {
      toonStatus('Gebouwhoogte ophalen…', 'bezig');
      fetch('https://api.3dbag.nl/collections/pand/items/' + encodeURIComponent(pandId) + '?f=json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var props  = data && data.properties;
          if (!props) { toonStatus('Postcode en bouwjaar ingevuld ✓', 'ok'); return; }
          console.log('3D BAG:', JSON.stringify(props).substring(0, 300));
          var hoogte = (props['h_dak_50p'] !== null && props['h_dak_50p'] !== undefined)
            ? props['h_dak_50p'] : props['h_dak_max'];
          if (hoogte !== null && hoogte !== undefined) {
            vulVeld(VELD.hoogte, String(hoogte));
            toonStatus('Alle BAG-gegevens ingevuld ✓', 'ok');
          } else {
            toonStatus('Postcode en bouwjaar ingevuld ✓', 'ok');
          }
        })
        .catch(function() {
          toonStatus('Postcode en bouwjaar ingevuld ✓', 'ok');
        });
    }
  </script>
</body>
</html>
